<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" role="img"><title>prerequisites</title><rect width="100%" height="100%" fill="#f3f7f3"/><g font-family="DejaVu Sans, sans-serif"><polygon points="35,230 90,65 175,230" stroke="#183f37" stroke-width="2.2" fill="#dce9df"/><circle cx="35" cy="230" r="3.5" fill="#a55f26"/><text x="42" y="223" font-size="17" fill="#143d34">A</text><circle cx="90" cy="65" r="3.5" fill="#a55f26"/><text x="97" y="58" font-size="17" fill="#143d34">B</text><circle cx="175" cy="230" r="3.5" fill="#a55f26"/><text x="182" y="223" font-size="17" fill="#143d34">C</text><text x="35" y="285" font-size="17" fill="#143d34">A + B + C = 180°</text><polygon points="225,225 345,225 345,100" stroke="#183f37" stroke-width="2.2" fill="#dce9df"/><circle cx="225" cy="225" r="3.5" fill="#a55f26"/><text x="232" y="218" font-size="17" fill="#143d34">A</text><circle cx="345" cy="225" r="3.5" fill="#a55f26"/><text x="352" y="218" font-size="17" fill="#143d34">B</text><circle cx="345" cy="100" r="3.5" fill="#a55f26"/><text x="352" y="93" font-size="17" fill="#143d34">C</text><text x="215" y="285" font-size="17" fill="#143d34">c² = a² + b²</text><polygon points="415,225 555,225 600,95 460,95" stroke="#183f37" stroke-width="2.2" fill="none"/><line x1="460" y1="95" x2="460" y2="225" stroke="#183f37" stroke-width="2.2" stroke-dasharray="6 5"/><text x="467" y="163" font-size="17" fill="#143d34">h</text><text x="487" y="238" font-size="17" fill="#143d34">b</text><text x="430" y="285" font-size="17" fill="#143d34">Área = bh</text><polygon points="615,225 730,225 680,95" stroke="#183f37" stroke-width="2.2" fill="#dce9df"/><circle cx="615" cy="225" r="3.5" fill="#a55f26"/><text x="622" y="218" font-size="17" fill="#143d34">A</text><circle cx="730" cy="225" r="3.5" fill="#a55f26"/><text x="737" y="218" font-size="17" fill="#143d34">B</text><circle cx="680" cy="95" r="3.5" fill="#a55f26"/><text x="687" y="88" font-size="17" fill="#143d34">C</text><line x1="680" y1="95" x2="680" y2="225" stroke="#183f37" stroke-width="2.2" stroke-dasharray="6 5"/><text x="615" y="285" font-size="17" fill="#143d34">Área = bh/2</text></g></svg>